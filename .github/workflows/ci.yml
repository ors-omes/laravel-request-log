name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '^12.0', testbench: '^10.0', php: '8.2' }
          - { laravel: '^12.0', testbench: '^10.0', php: '8.3' }
          - { laravel: '^13.0', testbench: '^11.0', php: '8.3' }
          - { laravel: '^13.0', testbench: '^11.0', php: '8.4' }
          - { laravel: '^13.0', testbench: '^11.0', php: '8.5' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, intl
          coverage: none
      - run: composer update "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - run: composer test

  postgres:
    name: PostgreSQL / Laravel 13 / PHP 8.4
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: request_log_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REQUEST_LOG_TEST_DB: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: request_log_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, intl
          coverage: none
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: composer test

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer validate --strict
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: composer audit
      - run: composer format:test
      - run: composer analyse

  required:
    name: Required checks
    if: always()
    needs: [tests, postgres, quality]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = success
      - run: test "${{ needs.postgres.result }}" = success
      - run: test "${{ needs.quality.result }}" = success
